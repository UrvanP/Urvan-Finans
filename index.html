<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Urvan Finance</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0d0b" />
  <link rel="icon" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Urvan Finance" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <button type="button" class="header-identity" id="header-identity" title="Urvan Finance">
      <span class="header-badge" id="header-badge">₪</span>
      <span class="header-identity-name" id="header-identity-name">Urvan Finance</span>
    </button>
    <div class="header-actions">
      <button id="btn-search" class="icon-btn header-icon-btn" title="Поиск"></button>
      <button id="btn-privacy" class="icon-btn header-icon-btn" title="Скрыть суммы"></button>
      <button id="btn-theme" class="icon-btn header-icon-btn" title="Тема"></button>
      <button id="btn-lang" class="icon-btn header-icon-btn" title="Язык"></button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="overview">Общий статус</button>
    <!-- Кнопки для членов семьи и остальные вкладки добавляются автоматически из JS -->
  </nav>

  <main id="app"></main>

  <button id="fab" class="fab" style="display:none;" title="+">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="modal-root"></div>

  <!-- Supabase подключается с CDN, поэтому не нужно ничего устанавливать.
       xlsx (парсер Excel/CSV) грузится лениво, только когда реально открывают
       вкладку "Настройки" с импортом — он тяжёлый и нужен не на каждой загрузке. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Остальной код — ES-модули: app.js сам подтягивает все свои зависимости
       через import, поэтому здесь нужен только один <script>. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
