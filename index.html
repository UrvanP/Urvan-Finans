<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Urvan Finance</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3b6ef6" />
  <link rel="icon" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Urvan Finance" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1><span id="app-title-text">Urvan Finance</span></h1>
    <div class="header-actions">
      <button id="btn-privacy" class="icon-btn header-icon-btn" title="Скрыть суммы">👁️</button>
      <button id="btn-lang" class="icon-btn header-icon-btn" title="Язык">🌐</button>
      <button id="btn-categories" class="btn btn-ghost">Категории</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="overview">Общий статус</button>
    <!-- Кнопки для членов семьи добавляются автоматически из JS -->
  </nav>

  <main id="app"></main>

  <div id="modal-root"></div>

  <!-- Библиотека supabase-js подключается с CDN, поэтому не нужно ничего устанавливать -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
